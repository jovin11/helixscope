<!DOCTYPE html>
<html>
<head>
    <title>Protein Secondary Structure Predictor</title>
</head>
<body>
    <h1>Protein Secondary Structure Predictor</h1>
    <form id="prediction-form">
        <textarea id="sequence" placeholder="Enter protein sequence"></textarea>
        <button type="submit">Predict</button>
    </form>
    <div id="result"></div>
    <script>
        document.getElementById('prediction-form').onsubmit = async (e) => {
            e.preventDefault();
            const sequence = document.getElementById('sequence').value;
            const response = await fetch('http://localhost:5001/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sequence })
            });
            const result = await response.json();
            document.getElementById('result').innerText = JSON.stringify(result.prediction);
        };
    </script>
</body>
</html>
