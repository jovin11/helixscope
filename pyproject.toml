[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "helixscope"
version = "1.0.0"
description = "Residue-level Q3 protein secondary structure prediction with a CNN-LSTM"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "Flask>=3.0,<4",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
ml = ["tensorflow>=2.16,<2.19"]
research = [
    "biopython>=1.83,<2",
    "matplotlib>=3.8,<4",
    "scikit-learn>=1.4,<2",
]
server = ["gunicorn>=22,<24"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
pssp-predict = "cli:main"

[tool.setuptools]
package-dir = {"" = "python_service"}
py-modules = ["app", "cli"]

[tool.setuptools.packages.find]
where = ["python_service"]
include = ["pssp*"]

[tool.pytest.ini_options]
addopts = "-q --cov=pssp --cov=pssp_model --cov=app --cov-report=term-missing"
pythonpath = ["python_service"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
